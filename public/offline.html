<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <title>Hors connexion · Quiz</title>
  <link rel="icon" type="image/png" href="/icons/favicon-32.png">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; background: #0b0c0e; color: #e9eaed;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; letter-spacing: -.01em; }
    p { margin: 0 0 24px; color: #8b8f99; }
    button { font: inherit; font-weight: 600; color: #fff; background: #6670e0; border: 0; border-radius: 10px;
             padding: 12px 22px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>Pas de connexion</h1>
    <p>Quiz a besoin d'internet pour charger tes questions et tes duels. Vérifie ta connexion puis réessaie.</p>
    <button type="button" id="retry">Réessayer</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
